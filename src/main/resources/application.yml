server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: agentdesk
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agentdesk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USERNAME:agentdesk}
    password: ${DB_PASSWORD:agentdesk123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

agentdesk:
  jwt:
    secret: ${JWT_SECRET:agentdesk-local-dev-secret-key-change-me-please-2026}
    expire-hours: 168
  llm:
    # mock：内置规则模型，无需 API Key 即可完整演示 Agent 流程
    # openai：任意 OpenAI 兼容接口（DeepSeek / 通义 / OpenAI）
    mode: ${LLM_MODE:mock}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    timeout-seconds: 60
    temperature: 0.2
  agent:
    max-steps: 5
    history-size: 6
  rag:
    chunk-size: 320
    chunk-overlap: 60
    top-k: 4
    min-score: 0.08
    keyword-weight: 0.35
  demo:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    root: info
    com.agentdesk: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
